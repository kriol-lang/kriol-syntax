name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The compiler changes in its own repository; check weekly that this one still matches it.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kriol-lang/kriol
          path: .kriol-compiler

      - name: Test
        run: npm test
        env:
          KRIOL_COMPILER_DIR: .kriol-compiler
